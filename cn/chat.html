<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>极简 P2P 匿名聊天</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 10px; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    .msg { margin: 5px 0; }
    .me { color: blue; }
    .peer { color: green; }
    .system { color: #888; font-size: 0.9em; }
  </style>
  <!-- 引入 PeerJS SDK -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>极简 P2P 匿名聊天</h2>
  <div>
    <p>你的 ID: <b id="my-id">生成中...</b></p>
    <input type="text" id="peer-id-input" placeholder="输入对方的 ID">
    <button onclick="connectToPeer()">连接对方</button>
  </div>

  <hr>

  <div id="chat-box"></div>

  <div>
    <input type="text" id="message-input" placeholder="输入消息..." disabled>
    <button id="send-btn" onclick="sendMessage()" disabled>发送</button>
  </div>

  <script>
    let peer = new Peer(); // 创建 Peer 对象，自动连接公共信令服务器
    let conn = null;

    const myIdEl = document.getElementById('my-id');
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    // 获取分配到的随机 ID
    peer.on('open', (id) => {
      myIdEl.innerText = id;
      appendLog('系统', '已准备就绪，将你的 ID 发给对方，或输入对方 ID 开始聊天。');
    });

    // 监听来自对方的连接申请
    peer.on('connection', (connection) => {
      conn = connection;
      setupConnection();
      appendLog('系统', '对方已成功连接到你！');
    });

    // 主动发起连接
    function connectToPeer() {
      const targetId = document.getElementById('peer-id-input').value.trim();
      if (!targetId) return alert('请输入对方的 ID');
      conn = peer.connect(targetId);
      setupConnection();
      appendLog('系统', '正在尝试连接对方...');
    }

    // 设置连接监听
    function setupConnection() {
      conn.on('open', () => {
        msgInput.disabled = false;
        sendBtn.disabled = false;
        appendLog('系统', 'P2P 通道已建立，可以开始匿名聊天！');
      });

      // 接收到消息
      conn.on('data', (data) => {
        appendLog('对方', data, 'peer');
      });

      conn.on('close', () => {
        appendLog('系统', '连接已断开。');
        msgInput.disabled = true;
        sendBtn.disabled = true;
      });
    }

    // 发送消息
    function sendMessage() {
      const text = msgInput.value;
      if (!text || !conn) return;
      conn.send(text);
      appendLog('我', text, 'me');
      msgInput.value = '';
    }

    function appendLog(sender, text, className = 'system') {
      const div = document.createElement('div');
      div.className = `msg ${className}`;
      div.innerText = `[${sender}]: ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
