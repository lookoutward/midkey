
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Midkey 图书馆，分享知识与思想。每本书均可免费下载，并通过 Midkey Note 导入阅读。">
  <title>Midkey 图书馆</title>

  <style>
    :root {
      color-scheme: light;
      --text: #222222;
      --muted: #777777;
      --border: #e8e8e8;
      --accent: #2563eb;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", "PingFang SC", sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand span {
      color: var(--muted);
      font-weight: 400;
    }

    main {
      padding: 64px 0 80px;
      min-height: 65vh;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 6vw, 40px);
      line-height: 1.3;
      letter-spacing: -1px;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .books {
      margin-top: 42px;
      border-top: 1px solid var(--border);
    }

    .book {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }

    .book-info {
      min-width: 0;
    }

    .book-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
    }

    .book-title a:hover {
      color: var(--accent);
    }

    .book-desc {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .download {
      flex-shrink: 0;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.2s, color 0.2s;
    }

    .download:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .note {
      margin-top: 32px;
      padding: 16px 18px;
      background: #f7f8fa;
      border-radius: 8px;
      color: #666666;
      font-size: 13px;
    }

    .note a {
      color: var(--accent);
    }

    footer {
      padding: 24px 0 32px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-bottom: 12px;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    @media (max-width: 480px) {
      main {
        padding: 44px 0 60px;
      }

      .book {
        gap: 12px;
      }

      .book-title {
        font-size: 16px;
      }

      .download {
        padding: 6px 10px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <a class="brand" href="https://www.midkey.xyz/">
        Midkey <span>图书馆</span>
      </a>
    </div>
  </header>

  <main class="container">
    <h1>Midkey 图书馆</h1>
    <p class="intro">
      分享知识与思想。每一本书，都是一份可以带走的知识。
    </p>

    <section class="books" aria-label="图书列表">

      <!-- 新书上线时，复制下面的 book 区块即可 -->

      <article class="book">
        <div class="book-info">
          <h2 class="book-title">
              《无人机战争》
          </h2>
          <p class="book-desc">
            从廉价无人机到智能战场。
          </p>
        </div>
        <a class="download"
           href="./books/Note-V2-无人机战争.json"
           download="Note-V2-无人机战争.json">
          下载 JSON
        </a>
      </article>

      <article class="book">
        <div class="book-info">
          <h2 class="book-title">
              《示例图书二》
          </h2>
          <p class="book-desc">
            在这里填写另一本书的简短介绍。
          </p>
        </div>
        <a class="download"
           href="./book-002.json"
           download="book-002.json">
          下载 JSON
        </a>
      </article>

      <!-- 新书区块结束 -->

    </section>

    <div class="note">
      下载图书 JSON 文件后，打开
      <a href="../note/">Midkey Note</a>，
      导入文件即可阅读。
    </div>
  </main>

  <footer>
    <div class="container">
      <nav class="footer-links" aria-label="页脚导航">
        <a href="../note/">Midkey Note</a>
        <a href="https://www.midkey.xyz/">官网</a>
      </nav>
      <div>© <span id="year">2026</span> Midkey</div>
    </div>
  </footer>

</body>
</html>
